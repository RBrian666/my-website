<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首爾四日行程 2026/11/26–11/29</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#17211c;--mute:#5e6b64;--line:#d9dfdc;--g:#00a84d;--gd:#067a3b;--food:#e4572e;--spot:#2f6fdb;--move:#8a94a0;--hotel:#7a4fd1;--chip:#e9f6ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--ink:#e8efeb;--mute:#9aa8a0;--line:#2b3832;--g:#2ed47a;--gd:#2ed47a;--chip:#173a28;--food:#ff7a52;--spot:#6c9cff;--hotel:#a98af0}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--ink:#e8efeb;--mute:#9aa8a0;--line:#2b3832;--g:#2ed47a;--gd:#2ed47a;--chip:#173a28;--food:#ff7a52;--spot:#6c9cff;--hotel:#a98af0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:var(--g);color:#fff;padding:36px 20px 28px}
.wrap{max-width:720px;margin:0 auto}
h1{margin:0;font-weight:900;font-size:clamp(34px,9vw,56px);line-height:1.1;letter-spacing:.02em}
header p{margin:10px 0 0;opacity:.92}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.facts span{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav .wrap{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
nav button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 14px;font:inherit;font-size:13px;line-height:1.35;cursor:pointer;text-align:center}
nav button b{display:block;font-size:16px}
nav button[aria-selected="true"]{background:var(--g);border-color:var(--g);color:#fff}
nav button:focus-visible{outline:3px solid var(--spot);outline-offset:2px}
main{padding:22px 16px 60px}
h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
ol{list-style:none;margin:0;padding:0;position:relative}
ol::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:4px;background:var(--g);border-radius:2px;opacity:.35}
li{position:relative;padding-left:34px;margin-bottom:14px}
li::before{content:"";position:absolute;left:0;top:14px;width:18px;height:18px;border-radius:50%;background:var(--card);border:4px solid var(--c,var(--move))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
.time{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.t{font-weight:700;font-size:16.5px;margin:0}
.tr{margin:6px 0 0;font-size:13.5px;color:var(--gd);background:var(--chip);border-radius:8px;padding:3px 9px;display:inline-block}
.note{margin:7px 0 0;font-size:13.5px;color:var(--mute);white-space:pre-line}
.tag{font-size:11.5px;color:var(--c);font-weight:700;margin-left:6px}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding-bottom:30px}
@media (prefers-reduced-motion:no-preference){main section{animation:in .25s ease}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header><div class="wrap">

<p>2026/11/26（四）– 11/29（日）　弘大住宿，地鐵 2 號線走透透</p>
<div class="facts"><span>CI 160 · 07:50 起飛</span><span>CI 163 · 20:15 返台</span><span>住：樂天 L7 弘大</span></div>
</div></header>
<nav><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap" id="view"></div></main>
<footer>平安出門，吃飽回家</footer>
<script>
var K={food:["#e4572e","吃"],spot:["#2f6fdb","逛"],move:["#8a94a0","移動"],hotel:["#7a4fd1","住"]};
var D=[
{d:"11/26",w:"四",h:"出發、換錢、東大門",s:"早起飛韓國，下午逛市場和 DDP",i:[

["2015–2215","仁川機場 → 桃園機場","CI 163　ICN 第 2 航廈 → TPE 第 1 航廈","","move"],

var tabs=document.getElementById("tabs"),view=document.getElementById("view");
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function show(n){
 var x=D[n];
 Array.prototype.forEach.call(tabs.children,function(b,j){b.setAttribute("aria-selected",j==n)});
 var h='<section><h2>Day '+(n+1)+'　'+esc(x.h)+'</h2><p class="sub">'+esc(x.s)+'</p><ol>';
 x.i.forEach(function(r){var k=K[r[4]];
  h+='<li style="--c:'+k[0]+'"><div class="card"><div class="time">'+esc(r[0])+'<span class="tag">'+k[1]+'</span></div><p class="t">'+esc(r[1])+'</p>'+
  (r[2]?'<div class="tr">'+esc(r[2]).replace(/\n/g,'<br>')+'</div>':'')+(r[3]?'<p class="note">'+esc(r[3])+'</p>':'')+'</div></li>'});
 view.innerHTML=h+'</ol></section>';
 try{location.hash="d"+(n+1)}catch(e){}
 window.scrollTo(0,0);
}
D.forEach(function(x,n){var b=document.createElement("button");b.setAttribute("role","tab");b.innerHTML='<b>Day '+(n+1)+'</b>'+x.d+'（'+x.w+'）';b.onclick=function(){show(n)};tabs.appendChild(b)});
function fromHash(){var m=/^#d([1-4])$/.exec(location.hash);show(m?m[1]-1:0)}
window.addEventListener("hashchange",fromHash);fromHash();
</script>

</html>
